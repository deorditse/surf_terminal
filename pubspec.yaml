name: surf_terminal
description: "Surf terminal project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  cupertino_icons: ^1.0.9
  dartssh2: ^4.1.0
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  sqflite: ^2.4.4
  xterm:
    git:
      url: https://github.com/TerminalStudio/xterm.dart.git
      ref: d35ba2cc72d0b89b0fd19af69d57df2c02f26a16
  liquid_glass_widgets: ^1.8.1

dev_dependencies:
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  freezed: ^4.0.2
  sqflite_common_ffi: 2.4.2+1

flutter:
  uses-material-design: true

  assets:
    - assets/branding/

flutter_native_splash:
  color: "#071018"
  image: assets/branding/splash-mark.png
  branding: assets/branding/splash-branding.png
  branding_mode: bottom
  fullscreen: true
  android_12:
    color: "#071018"
    image: assets/branding/splash-mark.png
    icon_background_color: "#071018"
    branding: assets/branding/splash-branding.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app-icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#071018"
  adaptive_icon_foreground: assets/branding/app-icon-foreground.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
